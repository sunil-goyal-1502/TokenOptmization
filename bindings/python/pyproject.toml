[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokenopt"
version = "0.1.0"
description = "Python client for TokenOpt context compiler (HTTP + embedded types)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["tokenopt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
