[workspace]
resolver = "2"
members = [
    "crates/tokenopt-core",
    "crates/tokenopt-cli",
    "crates/tokenopt-server",
]
default-members = ["crates/tokenopt-core", "crates/tokenopt-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tokenopt/token-optimization"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "=1.10.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync"] }
clap = { version = "=4.5.37", features = ["derive"] }
axum = { version = "=0.7.9", features = ["json"] }
tower-http = { version = "=0.5.2", features = ["cors", "trace"] }
