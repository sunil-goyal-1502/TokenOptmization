[package]
name = "tokenopt-core"
description = "Sufficiency-gated context compiler for LLM agents"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
uuid.workspace = true
chrono.workspace = true
regex.workspace = true
async-trait.workspace = true
tokio.workspace = true
tiktoken-rs = { version = "0.6.0", optional = true }
reqwest = { version = "0.11.27", optional = true, default-features = false, features = ["json", "rustls-tls"] }

[features]
default = []
accurate-tokens = ["dep:tiktoken-rs"]
llm-http = ["dep:reqwest"]

[dev-dependencies]
tempfile = "=3.10.1"
